name: Streamlit deployment checks
on:
  push:
    branches: [main, streamlit-deployment-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py cyber_physical.py data_preprocessing.py model_training.py power_simulation.py explainability.py model_registry.py report_generator.py
      - name: Prepare model artifacts required by prediction tests
        run: python train.py --dataset synthetic_sample --epochs 1
      - name: Run tests
        run: python -m pytest -q
      - name: Start Streamlit and check health endpoint
        shell: bash
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/streamlit.log
              exit 1
            fi
            sleep 2
          done
          cat /tmp/streamlit.log
          exit 1
